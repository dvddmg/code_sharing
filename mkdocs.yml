site_name: code_sharing
site_url: https://dvddmg.github.io/code_sharing/
site_description: Pure Data plugins compiled with hvcc + DPF
site_author: Davide Bardi

repo_url: https://github.com/dvddmg/code_sharing
repo_name: code_sharing

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Passa al tema scuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Passa al tema chiaro

  features:
    - navigation.tabs           # tabs in alto
    - navigation.sections       # sezioni espanse nella sidebar
    - navigation.top            # bottone "torna su"
    - content.code.copy         # bottone copia nei code block
    - content.tabs.link         # tabs sincronizzati
  icon:
    repo: fontawesome/brands/github
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono


# ---------- PLUGIN ----------
plugins:
  - search

  - blog:
      blog_dir: blog                    # cartella del blog dentro docs/
      blog_toc: true                    # table of contents nei post
      post_date_format: d MMMM yyyy    # es: "15 giugno 2025"
      post_url_format: "{slug}"         # URL puliti: /blog/nome-post/
      archive: true                     # archivio per anno
      archive_name: Archivio            # nome nella nav
      archive_date_format: yyyy         # raggruppamento per anno
      archive_url_format: "archivio/{date}"
      categories: true                  # categorie
      categories_name: Categorie
      categories_url_format: "categoria/{slug}"
      pagination: true                  # paginazione nella lista post
      pagination_per_page: 10
      post_excerpt: required            # mostra anteprima nella lista

  - tags:
      tags_file: tags/index.md          # pagina indice dei tag

# estensioni markdown
markdown_extensions:
  - admonition                  # box note/warning/tip
  - pymdownx.details            # admonition richiudibili
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:            # tabs nel contenuto
      alternate_style: true
  - pymdownx.highlight:         # syntax highlighting
      anchor_linenums: true
  - pymdownx.inlinehilite       # inline code highlighting
  - attr_list                   # attributi su elementi
  - md_in_html                  # markdown dentro html
  - tables                      # tabelle
  - toc:                        # table of contents
      permalink: true

# css custom
extra_css:
  - stylesheets/extra.css

# ---------- NAVIGAZIONE ----------
nav:
  - Home: index.md
  - Blog:
    - blog/index.md
  - Tag: tags/index.md
  - Installazione: install.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dvddmg
